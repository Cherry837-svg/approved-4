<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <meta name="theme-color" content="#000000"> <title>Интерполяционные часы</title> <style> /* ===================================================== 1. ОСНОВНЫЕ НАСТРОЙКИ ===================================================== */ :root { --background: #000000; --date-size: 3rem; --clock-size: 8rem; --seconds-size: 0.64em; --date-gap: 18px; --battery-gap: 24px; --main-color: #800000; /* Амплитуда движения */ --move-x: 25px; --move-y: 25px; /* Длительность полного круга */ --move-time: 36s; } * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--background); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; } body { display: flex; justify-content: center; align-items: center; font-family: "Courier New", Courier, monospace; } /* ===================================================== 2. СЛОЙ ЧАСОВ ===================================================== */ #interactive-zone { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 100%; margin-top: -20px; text-align: center; transform: translate3d(0, 0, 0); will-change: transform; } /* ===================================================== 3. ПЛАВНОЕ КРУГОВОЕ ДВИЖЕНИЕ ===================================================== */ /* Движение выполняется CSS-анимацией. Полный круг: 9 секунд. Максимальное смещение по X: ±25 px. Максимальное смещение по Y: ±25 px. JavaScript не пересчитывает координаты каждый кадр. Браузер самостоятельно выполняет анимацию. */ @keyframes smoothCircleMove { 0% { transform: translate3d( var(--move-x), 0, 0 ); } 25% { transform: translate3d( 0, var(--move-y), 0 ); } 50% { transform: translate3d( calc(-1 * var(--move-x)), 0, 0 ); } 75% { transform: translate3d( 0, calc(-1 * var(--move-y)), 0 ); } 100% { transform: translate3d( var(--move-x), 0, 0 ); } } /* ===================================================== 4. ДАТА ===================================================== */ .date-row { color: var(--main-color); font-size: var(--date-size); font-weight: bold; letter-spacing: -1px; white-space: nowrap; margin-bottom: var(--date-gap); text-shadow: 0 0 12px var(--main-color), 0 0 25px var(--main-color); transition: color 1s linear, text-shadow 1s linear; } /* ===================================================== 5. ЦИФРОВЫЕ ЧАСЫ ===================================================== */ .clock { display: flex; justify-content: center; align-items: baseline; white-space: nowrap; color: var(--main-color); font-size: var(--clock-size); font-weight: 800; letter-spacing: 0.7px; line-height: 1; text-shadow: 0 0 18px var(--main-color), 0 0 38px var(--main-color); transition: color 1s linear, text-shadow 1s linear; } /* Часы и минуты */ .time-main { display: inline-block; white-space: nowrap; } /* Секунды */ .seconds { display: inline-block; font-size: var(--seconds-size); font-weight: 600; letter-spacing: 0; line-height: 1; margin-left: 0.08em; color: inherit; text-shadow: inherit; transition: color 1s linear, text-shadow 1s linear; } /* ===================================================== 6. ИНДИКАТОР БАТАРЕИ ===================================================== */ .battery-info { margin-top: var(--battery-gap); font-family: Arial, sans-serif; font-size: 1.3rem; font-weight: bold; letter-spacing: 1px; color: var(--main-color); text-shadow: 0 0 12px var(--main-color), 0 0 25px var(--main-color); transition: color 1s linear, text-shadow 1s linear; } /* ===================================================== 7. МОБИЛЬНЫЙ ЭКРАН ===================================================== */ @media (max-width: 600px) { :root { --date-size: 1.25rem; --clock-size: 4.2rem; --seconds-size: 0.46em; --date-gap: 20px; --battery-gap: 24px; } .date-row { letter-spacing: 0; } .battery-info { font-size: 1.8rem; } } @media (max-width: 360px) { :root { --date-size: 1rem; --clock-size: 3.3rem; --date-gap: 18px; --battery-gap: 22px; } } /* Горизонтальный режим */ @media (orientation: landscape) { .battery-info { font-size: 1.8rem; } } /* Вертикальный режим */ @media (orientation: portrait) { .date-row { font-size: 1.5rem; } } /* ===================================================== 8. ОТКЛЮЧЕНИЕ АНИМАЦИИ ПРИ ЗАПРОСЕ СИСТЕМЫ ===================================================== */ @media (prefers-reduced-motion: reduce) { #interactive-zone { animation: none; } } </style> </head> <body> <div id="interactive-zone"> <div id="date" class="date-row"> FR : 00.00.0000 </div> <div id="clock" class="clock"> <span id="time-main" class="time-main">00:00</span> <span id="seconds" class="seconds" hidden>00</span> </div> <div id="battery" class="battery-info"> BATTERY: -- </div> </div> <script> "use strict"; /* ===================================================== 9. ОСНОВНЫЕ ЭЛЕМЕНТЫ ===================================================== */ const dateElement = document.getElementById("date"); const clockElement = document.getElementById("clock"); const timeMainElement = document.getElementById("time-main"); const secondsElement = document.getElementById("seconds"); const batteryElement = document.getElementById("battery"); const interactiveZone = document.getElementById("interactive-zone"); /* ===================================================== 10. ДНИ НЕДЕЛИ ===================================================== */ const daysOfWeek = [ "7-Sun", "1-Mo", "2-Tue", "3-Wed", "4-Thu", "5-Fri", "6-Sat" ]; /* ===================================================== 11. ПОКАЗ И СКРЫТИЕ СЕКУНД ===================================================== */ let secondsVisible = false; function toggleSeconds() { secondsVisible = !secondsVisible; secondsElement.hidden = !secondsVisible; updateClock(); } /* ===================================================== 12. ОБНОВЛЕНИЕ ВРЕМЕНИ И ДАТЫ ===================================================== */ function updateClock() { const now = new Date(); const hours = String(now.getHours()).padStart(2, "0"); const minutes = String(now.getMinutes()).padStart(2, "0"); const seconds = String(now.getSeconds()).padStart(2, "0"); timeMainElement.textContent = `${hours}:${minutes}`; secondsElement.textContent = seconds; const dayName = daysOfWeek[now.getDay()]; const day = String(now.getDate()).padStart(2, "0"); const month = String(now.getMonth() + 1).padStart(2, "0"); const year = now.getFullYear(); dateElement.textContent = `${dayName} : ${day}.${month}.${year}`; } /* ===================================================== 13. ИНТЕРПОЛЯЦИЯ ЦВЕТА БАТАРЕИ ===================================================== */const colorStops = [
    { level: 0.00, r: 100, g: 0,   b: 0   }, // 0% — тёмно-красный
    { level: 0.05, r: 255, g: 0,   b: 0   }, // 5% — красный
    { level: 0.17, r: 255, g: 100, b: 0   }, // 17% — оранжевый
    { level: 0.30, r: 255, g: 230, b: 0   }, // 30% — жёлтый
    { level: 0.42, r: 0,   g: 255, b: 0   }, // 42% — зелёный
    { level: 0.60, r: 0,   g: 255, b: 190 }, // 60% — бирюзовый
    { level: 0.72, r: 0,   g: 100, b: 255 }, // 72% — синий
    { level: 0.85, r: 100, g: 0,   b: 255 }, // 85% — фиолетовый
    { level: 1.00, r: 190, g: 0,   b: 255 }  // 100% — ярко-фиолетовый
]; function interpolateColor(level) { level = Math.max(0, Math.min(1, level)); let left = colorStops[0]; let right = colorStops[colorStops.length - 1]; for (let i = 0; i < colorStops.length - 1; i++) { if ( level >= colorStops[i].level && level <= colorStops[i + 1].level ) { left = colorStops[i]; right = colorStops[i + 1]; break; } } const range = right.level - left.level; const progress = range === 0 ? 0 : (level - left.level) / range; const r = Math.round( left.r + (right.r - left.r) * progress ); const g = Math.round( left.g + (right.g - left.g) * progress ); const b = Math.round( left.b + (right.b - left.b) * progress ); return { r, g, b, css: `rgb(${r}, ${g}, ${b})` }; } /* ===================================================== 14. ПРИМЕНЕНИЕ ЦВЕТА КО ВСЕМ ЭЛЕМЕНТАМ ===================================================== */ function updateClockColor(level) { const percent = Math.round(level * 100); const color = interpolateColor(level); const glowStrong = `0 0 18px rgba(${color.r}, ${color.g}, ${color.b}, 0.85)`; const glowSoft = `0 0 38px rgba(${color.r}, ${color.g}, ${color.b}, 0.4)`; document.documentElement.style.setProperty( "--main-color", color.css ); clockElement.style.color = color.css; clockElement.style.textShadow = `${glowStrong}, ${glowSoft}`; secondsElement.style.color = color.css; secondsElement.style.textShadow = `${glowStrong}, ${glowSoft}`; dateElement.style.color = color.css; dateElement.style.textShadow = `${glowStrong}, ${glowSoft}`; batteryElement.style.color = color.css; batteryElement.style.textShadow = `${glowStrong}, ${glowSoft}`; batteryElement.textContent = `Battery=${percent}%`; } /* ===================================================== 15. ПОЛУЧЕНИЕ ДАННЫХ БАТАРЕИ ===================================================== */ let currentBatteryLevel = 1; async function initBattery() { if ("getBattery" in navigator) { try { const battery = await navigator.getBattery(); currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); battery.addEventListener("levelchange", () => { currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); }); battery.addEventListener("chargingchange", () => { currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); }); return; } catch (error) { console.log( "Не удалось получить уровень батареи.", error ); } } batteryElement.textContent = "БАТАРЕЯ: НЕТ ДАННЫХ"; currentBatteryLevel = 0.5; updateClockColor(currentBatteryLevel); } /* ===================================================== 16. ЗАЩИТА OLED ОТ ВЫГОРАНИЯ ===================================================== */ /* CSS-анимация выполняет полный круг за 9 секунд. Нет JavaScript-цикла requestAnimationFrame. Нет постоянного пересчёта координат. Нет округления координат каждый кадр. Движение непрерывное, по замкнутой траектории. */ interactiveZone.style.animation = "smoothCircleMove var(--move-time) linear infinite"; /* ===================================================== 17. НЕГАСНУЩИЙ ЭКРАН ===================================================== */ let wakeLock = null; let wakeLockRequested = false; async function enableWakeLock() { if (!("wakeLock" in navigator)) { return; } if (wakeLockRequested && wakeLock !== null) { return; } try { wakeLockRequested = true; wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; wakeLockRequested = false; }); } catch (error) { wakeLock = null; wakeLockRequested = false; console.log("Wake Lock недоступен:", error); } } /* Повторное включение после возвращения на страницу */ document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { enableWakeLock(); } }); /* ===================================================== 18. ПОЛНОЭКРАННЫЙ РЕЖИМ ===================================================== */ async function toggleFullscreen() { try { if (!document.fullscreenElement) { await document.documentElement.requestFullscreen(); } else { await document.exitFullscreen(); } } catch (error) { console.log( "Не удалось изменить полноэкранный режим:", error ); } } /* ===================================================== 19. ОБРАБОТКА ДВОЙНОГО И ТРОЙНОГО НАЖАТИЯ ===================================================== */ let tapCount = 0; let tapTimer = null; const tapDelay = 350; function handleTap(event) { if ( event.pointerType === "mouse" && event.button !== 0 ) { return; } tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(async () => { const count = tapCount; tapCount = 0; if (count === 2) { toggleSeconds(); } else if (count === 3) { await toggleFullscreen(); } }, tapDelay); } /* Касания регистрируются по всему экрану */ document.addEventListener("pointerup", handleTap); /* ===================================================== 20. ЗАПУСК ЧАСОВ ===================================================== */ updateClock(); setInterval(updateClock, 200); initBattery(); enableWakeLock(); </script> </body> </html>
